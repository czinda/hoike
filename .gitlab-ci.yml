# hoike GitLab CI/CD Pipeline
#
# This is the secondary CI system. GitHub Actions (.github/workflows/ci.yml)
# is authoritative and has additional jobs (container image, security audit,
# multi-target cross-compilation). This pipeline covers the core gate for
# the GitLab mirror.
#
# Runner requirements:
#   - Docker executor (uses rust:1.97-slim image)
#   - At least 4GB RAM for ML-DSA compilation
#   - If gitlab.heebh.st has no shared runners, register a runner:
#     gitlab-runner register --url https://gitlab.heebh.st --token <TOKEN>
#
# Cache: keyed by Cargo.lock hash, stored per-stage to avoid lock contention.
# Release: triggered only on v* tags, uploads binaries via generic packages API.

stages:
  - check
  - test
  - build
  - release

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  CARGO_INCREMENTAL: "0"

# ── Reusable cache template ──────────────────────────────────────────
.rust-cache:
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db
      - target/

# ── Stage 1: check (fast gate) ──────────────────────────────────────

cargo-check:
  stage: check
  image: rust:1.97-slim
  extends: .rust-cache
  cache:
    key:
      files:
        - Cargo.lock
      prefix: check
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db
      - target/
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends cmake build-essential pkg-config
    - rustup component add clippy rustfmt
    - cargo check --workspace --locked
    - cargo clippy --workspace --locked -- -D warnings
    - cargo fmt --all -- --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage 2: test ────────────────────────────────────────────────────

cargo-test:
  stage: test
  image: rust:1.97-slim
  extends: .rust-cache
  cache:
    key:
      files:
        - Cargo.lock
      prefix: test
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db
      - target/
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends cmake build-essential pkg-config
    - set -o pipefail
    - cargo test --workspace --locked 2>&1 | tee test-output.txt
    - cargo test --workspace --locked --features tls,metrics,pkcs11,dogtag-sync
    - cargo check -p ahu --no-default-features --lib --locked
    - cargo test -p ahu --no-default-features --locked
    - cargo test -p ahu --release --locked --test integration overflowing_entry_offsets_never_panic_in_heap_or_mmap
    - echo "Test summary:"
    - grep "^test result" test-output.txt
  artifacts:
    when: always
    paths:
      - test-output.txt
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ── Stage 3: build ───────────────────────────────────────────────────

build-linux-x86_64:
  stage: build
  image: rust:1.97-slim
  extends: .rust-cache
  cache:
    key:
      files:
        - Cargo.lock
      prefix: build
    paths:
      - .cargo/registry/cache
      - .cargo/registry/index
      - .cargo/git/db
      - target/
  script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends cmake build-essential pkg-config
    - cargo build --release --locked
    - strip target/release/hoike target/release/ahu || true
    - mkdir -p artifacts
    - cp target/release/hoike target/release/ahu artifacts/
    - |
      echo "Binary sizes:"
      ls -lh artifacts/hoike artifacts/ahu
    - |
      cd artifacts
      tar czf hoike-${CI_COMMIT_TAG:-dev}-x86_64-unknown-linux-gnu.tar.gz hoike ahu
      sha256sum hoike-${CI_COMMIT_TAG:-dev}-x86_64-unknown-linux-gnu.tar.gz > checksums.sha256
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

# ── Stage 4: release ─────────────────────────────────────────────────

upload-release-assets:
  stage: release
  image: curlimages/curl:latest
  needs:
    - build-linux-x86_64
  script:
    - |
      TARBALL="hoike-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz"
      if [ -f "artifacts/hoike-dev-x86_64-unknown-linux-gnu.tar.gz" ]; then
        mv "artifacts/hoike-dev-x86_64-unknown-linux-gnu.tar.gz" "artifacts/${TARBALL}"
      fi
    - |
      echo "Uploading ${TARBALL} to generic packages..."
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "artifacts/${TARBALL}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hoike/${CI_COMMIT_TAG}/${TARBALL}"
    - |
      echo "Uploading checksums..."
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "artifacts/checksums.sha256" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hoike/${CI_COMMIT_TAG}/checksums.sha256"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - upload-release-assets
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "hoike ${CI_COMMIT_TAG}"
    description: |
      ## hoike ${CI_COMMIT_TAG}

      Rust OCSP responder for pre-signed ahu bundles.

      ### Downloads

      | Platform | File |
      |----------|------|
      | Linux x86_64 | [hoike-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hoike/${CI_COMMIT_TAG}/hoike-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz) |

      ### Checksums

      See [checksums.sha256](${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hoike/${CI_COMMIT_TAG}/checksums.sha256)
    assets:
      links:
        - name: "hoike-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hoike/${CI_COMMIT_TAG}/hoike-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          link_type: package
        - name: "checksums.sha256"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hoike/${CI_COMMIT_TAG}/checksums.sha256"
          link_type: other
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

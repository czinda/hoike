# Edge configuration for Docker Compose (ML-DSA bundle)

[server]
mode = "edge"
listen = "0.0.0.0:2561"
max_request = 8192

[storage]
bundle_dir = "/demo/bundles"
state_db = "/demo/state-mldsa"
max_chain = 24
# Explicit unauthenticated demo admission; production requires seal_signer_pins
# or seal_trust_anchors. Configured trust is never bypassed by this flag.
allow_unauthenticated_bundles = true

[[ca]]
label = "demo-ca"
bundle_file = "/demo/bundles/demo-mldsa-epoch1.ahu"
nonce_policy = "ignore"
completeness = "partial"

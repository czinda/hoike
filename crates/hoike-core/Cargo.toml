[package]
name = "hoike-core"
version = "0.1.0"
description = "CertID routing, request parsing, and response assembly for hoike"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ahu = { path = "../ahu" }
# Use der 0.7 to match x509-ocsp's dependency (0.2.1 uses der 0.7)
der = { version = "0.7", features = ["alloc"] }
x509-ocsp = { workspace = true }
sha2 = { workspace = true }
digest = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
arc-swap = { workspace = true }

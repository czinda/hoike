[package]
name = "hoike-core"
version = "0.1.0"
description = "CertID routing, request parsing, and response assembly for hoike"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ahu = { path = "../ahu" }
# Use der 0.7 to match x509-ocsp's dependency (0.2.1 uses der 0.7)
der = { version = "0.7", features = ["alloc", "derive"] }
spki = { version = "0.7", features = ["alloc"] }
const-oid = { version = "0.9", features = ["db"] }
x509-ocsp = { workspace = true }
x509-cert = { version = "0.2", features = ["std"] }
sha2 = { workspace = true }
digest = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
arc-swap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
uuid = { workspace = true }

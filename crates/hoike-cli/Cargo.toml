[package]
name = "hoike-cli"
version = "0.2.0"
description = "CLI for hoike OCSP responder and ahu bundle tools"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hoike"
path = "src/main.rs"

[[bin]]
name = "ahu"
path = "src/ahu_main.rs"

[dependencies]
ahu = { path = "../ahu" }
hoike-core = { path = "../hoike-core" }
hoike-server = { path = "../hoike-server" }
hoike-sign = { path = "../hoike-sign" }
hoike-gossip = { path = "../hoike-gossip" }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }
sha2 = { workspace = true }
sha2_v010 = { package = "sha2", version = "0.10", features = ["oid"] }
signature = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7"
# der 0.7 ecosystem for parsing responder cert SPKI (matching x509-ocsp)
der = { version = "0.7", features = ["alloc"] }
x509-cert = { version = "0.2", features = ["std"] }
sha1 = { version = "0.10" }
x509-ocsp = { workspace = true }
ureq = "3"
spki = { version = "0.7", features = ["alloc"] }
const-oid = { version = "0.9" }

cryptoki = { version = "0.12", optional = true }

[features]
default = []
pkcs11 = ["hoike-sign/pkcs11", "dep:cryptoki"]
dogtag-sync = ["hoike-sign/dogtag-sync"]
metrics = ["hoike-server/metrics"]
tls = ["hoike-server/tls"]

[dev-dependencies]
tempfile = "3"

[package]
name = "hoike-cli"
version = "0.1.0"
description = "CLI for hoike OCSP responder and ahu bundle tools"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hoike"
path = "src/main.rs"

[[bin]]
name = "ahu"
path = "src/ahu_main.rs"

[dependencies]
ahu = { path = "../ahu" }
hoike-core = { path = "../hoike-core" }
hoike-server = { path = "../hoike-server" }
hoike-sign = { path = "../hoike-sign" }
hoike-gossip = { path = "../hoike-gossip" }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }
sha2 = { workspace = true }
sha2_v010 = { package = "sha2", version = "0.10", features = ["oid"] }
signature = "2"

[features]
default = []
pkcs11 = ["hoike-sign/pkcs11"]

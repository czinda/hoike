[package]
name = "hoike-gossip"
version = "0.2.0"
description = "SWIM membership and generation announcements for hoike"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true

[dependencies]
foca = { version = "2", features = ["postcard-codec"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
bytes = "1"
rand = "0.10"
hex = { workspace = true }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }

[dev-dependencies]
tokio = { workspace = true }

[package]
name = "ahu"
version = "0.2.0"
description = "The ahu pre-signed OCSP response bundle format: read, write, verify"
license = "Apache-2.0 OR MIT"
edition.workspace = true
rust-version.workspace = true

[dependencies]
sha2 = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true, optional = true }
hex = { workspace = true }
byteorder = { workspace = true }
bitflags = { workspace = true }
memmap2 = { workspace = true }

# CMS seal verification (der 0.8 ecosystem)
cms = { version = "0.3.0-pre.2", features = ["std"], optional = true }
der = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
spki = { workspace = true, optional = true }
p256 = { version = "0.14", features = ["ecdsa"], optional = true }
ecdsa_v017 = { package = "ecdsa", version = "0.17", features = ["der"], optional = true }
ml-dsa = { workspace = true, optional = true }

[features]
default = ["compression", "seal-verify"]
compression = ["dep:zstd"]
seal-verify = ["dep:cms", "dep:der", "dep:x509-cert", "dep:spki", "dep:p256", "dep:ecdsa_v017", "dep:ml-dsa"]

[dev-dependencies]
tempfile = "3"
hoike-sign = { path = "../hoike-sign" }
p256_v013 = { package = "p256", version = "0.13", features = ["ecdsa"] }

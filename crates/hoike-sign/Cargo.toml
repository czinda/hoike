[package]
name = "hoike-sign"
version = "0.2.0"
description = "Signing, generation production, and revocation source adapters for hoike"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ahu = { path = "../ahu" }
hoike-core = { path = "../hoike-core" }

# Use der 0.7 ecosystem to match x509-ocsp 0.2.1
der = { version = "0.7", features = ["alloc", "derive", "std", "oid"] }
x509-ocsp = { version = "0.2", features = ["builder", "std"] }
x509-cert = { version = "0.2", features = ["std"] }
const-oid = { version = "0.9", features = ["db"] }
spki = { version = "0.7", features = ["alloc", "std"] }

# Signing (0.10/2.x generation matching x509-ocsp builder)
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
signature = "2"
digest = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Post-quantum
ml-dsa = { workspace = true }

# PKCS#11 (optional — requires vendor C library at link time)
cryptoki = { version = "0.12", optional = true }

# LDAP syncrepl (optional — for Dogtag 389 DS source).
# default-features off: the default `tls` feature is native-tls, which
# `compile_error!`s when combined with `tls-rustls`. We keep the whole build on
# one crypto provider (aws-lc-rs, matching hoike-server's `tls` feature) and
# re-add `sync` explicitly (it provides the blocking `LdapConn`).
ldap3 = { version = "0.12", default-features = false, features = [
    "sync",
    "tls-rustls-aws-lc-rs",
], optional = true }

# rustls ClientConfig for LDAPS/StartTLS with a custom CA (FTP_ITC.1). Only
# needed on the dogtag-sync path; gated with it below.
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }

# CMS seal (uses der 0.8 ecosystem — separate from OCSP's der 0.7)
cms = { version = "0.3.0-pre.2", features = ["std"] }
der_v08 = { package = "der", version = "0.8", features = ["alloc", "derive", "std", "oid"] }
spki_v08 = { package = "spki", version = "0.8", features = ["alloc", "std"] }
x509-cert-v03 = { package = "x509-cert", version = "0.3", features = ["std"] }

# General
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }

[features]
default = []
pkcs11 = ["dep:cryptoki"]
dogtag-sync = ["dep:ldap3", "dep:rustls", "dep:rustls-pemfile"]

[dev-dependencies]
tempfile = "3"

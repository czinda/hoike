[workspace]
resolver = "2"
members = [
    "crates/ahu",
    "crates/hoike-core",
    "crates/hoike-sign",
    "crates/hoike-server",
    "crates/hoike-gossip",
    "crates/hoike-cli",
]

[workspace.package]
edition = "2024"
# Declared floor for first-party source: no first-party code may require a
# newer rustc (CI and the pinned rust-toolchain.toml build with 1.97). Note:
# building hoike-gossip requires rustc >= 1.88 in practice because the locked
# foca 2.0.0 dependency declares `rust-version = "1.88"` and cargo enforces
# dependency requirements against the invoking toolchain. A full workspace
# build on a 1.85 toolchain is therefore not currently possible; the 1.85
# floor is a source-level constraint on this repository's own code.
rust-version = "1.85"

[workspace.dependencies]
# RustCrypto
der = "0.8"
x509-cert = "0.3"
x509-ocsp = "0.2"
sha2 = "0.11"
digest = "0.11"
cms = "0.3.0-pre.2"
const-oid = "0.10"
spki = "0.8"

# Serialization
ciborium = "0.2"
ciborium-io = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# HTTP
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
hyper = "1"

# TLS (server-side management/trusted channels). aws-lc-rs provider for FIPS
# alignment (NIAP PPCA / TLS Functional Package). The OCSP data plane stays
# plaintext — these deps are gated behind the `tls` feature of each crate.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Config
toml = "0.8"

# General
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
memmap2 = "0.9"
zstd = "0.13"
hex = "0.4"
byteorder = "1"
bitflags = "2"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
percent-encoding = "2"
bcrypt = "0.17"
rand = "0.9"
include_dir = "0.7"
ml-dsa = { version = "0.1", features = ["pkcs8"] }
